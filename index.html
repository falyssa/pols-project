.counter .n{font-size:40px;font-weight:700}
.line{animation:lineIn .25s both}
.track{height:22px;background:#e6e1d4}

.pulse{animation:pulse 1.2s ease-in-out infinite;align-self:center;color:#fbfaf8;padding:8px 14px;font-size:15px;font-weight:700;text-align:center}

.shake{animation:shake .4s}
.headline{background:#222;color:#fbfaf8;padding:24px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}

.blink{animation:blink .5s steps(2,start) infinite}

.rise{animation:rise .5s 3.2s both}
.ratio{animation:ratio .5s 2.9s both}

@keyframes lineIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes stamp{0%{transform:scale(2.2) rotate(-10deg);opacity:0}60%{transform:scale(.94) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:1}}
@keyframes flyOut{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),-220px) rotate(var(--r));opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes jitter{0%,100%{transform:none}50%{transform:translateX(1px)}}
@keyframes blink{to{visibility:hidden}}
@keyframes feed{from{transform:translateY(-100%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ratio{0%{transform:scale(1.5);opacity:0}70%{transform:scale(.96);opacity:1}100%{transform:none}}
@media (max-width:520px){.paper{padding:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}h2{font-size:22px}.thought{font-size:11px}.counter .n{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>

  var red = spent>0||o.debt;
  var gap = ow.take-w.take;
  return hud()+'<div class="paper narrow" style="max-width:520px"><div class="row" style="font-size:13px;letter-spacing:1px"><span>RECEIPT · MONTH '+(g.m+1)+'</span><span>'+w.label+'</span></div><h2 class="sr">Receipt for month '+(g.m+1)+'</h2><div class="eq"></div><div class="row"><span>Paycheck (take-home, est.)</span><span>'+money(w.take)+'</span></div><div class="row"><span>Rent, food, power, gas</span><span>-'+money(BASE_BILLS).slice(1)+'</span></div>'+(extras?'<div class="row"><span>Other monthly costs</span><span>-'+money(extras).slice(1)+'</span></div>':'')+'<div class="row" style="font-weight:700"><span>'+esc(o.label)+'</span><span>'+esc(o.tag)+'</span></div><div class="eq"></div><div class="row big"><span>CASH</span><span'+(g.cash<500?' class="neg"':'')+'>'+money(g.cash)+'</span></div><div class="row"><span>Debt</span><span>'+money(g.debt)+'</span></div><div class="row"><span>Stress</span><span>'+bar(g.stress)+'</span></div><div class="row"><span>Future</span><span>'+bar(g.future)+'</span></div><div class="eq"></div><p class="body" style="font-size:14px">'+esc(o.note)+'</p><div class="chip" style="text-align:left">'+(S.world==='today'?'In the other Georgia, this month’s paycheck was '+money(gap)+' bigger.':'In today’s Georgia, this month’s paycheck would be '+money(-gap)+' smaller.')+'</div><button class="btn" id="next">'+(g.m>=7?'[ SEE HOW THE YEAR WENT ]':'[ TEAR OFF · NEXT MONTH ]')+'</button><div class="stamp" style="color:'+(red?'#b3261e':'#1d7a4a')+'">'+esc(o.stamp)+'</div>'+fly+'</div>';
};
R.counter = function(){
  var c=S.counter;
  return '<div class="headline"><p class="kicker" style="color:#c6f25a">OVERHEARD IN THE BREAK ROOM</p><h2 class="q">'+esc(c.q)+'</h2></div><div class="paper"><p class="kicker">HERE’S THE THING</p>'+c.pts.map(function(p,i){ return '<div class="point"><span>0'+(i+1)+'</span><span>'+esc(p)+'</span></div>'; }).join('')+'<div class="eq"></div><div class="row"><span>Verdict</span><b class="neg">'+c.verdict+'</b></div><button class="btn" id="backwork">[ BACK TO WORK ]</button>'+src(c.src)+'</div>';
};
R.yearend = function(){
  var r=S.results[S.world], w=W(), c=CHARS[r.char], both=S.results.today&&S.results.cap;
  return '<div class="paper narrow"><p class="kicker" style="text-align:center">YEAR-END RECEIPT · '+w.label+'</p><h2 style="text-align:center">'+c.name.toUpperCase()+', 25</h2><div class="eq"></div><div class="row"><span>Total earned</span><span>'+money(r.earned)+'</span></div><div class="row"><span>Total spent</span><span>-'+money(r.spent).slice(1)+'</span></div><div class="row big"><span>Cash left</span><span'+(r.cash<500?' class="neg"':'')+'>'+money(r.cash)+'</span></div><div class="row"><span>Debt</span><span'+(r.debt?' class="neg"':'')+'>'+money(r.debt)+'</span></div><div class="row"><span>Stress</span><span>'+bar(r.stress)+'</span></div><div class="row"><span>Future</span><span>'+bar(r.future)+'</span></div><div class="eq"></div><p class="kicker" style="color:#222">WHAT YOU MISSED</p><p class="body" style="font-size:14px">'+(r.missed.length?r.missed.map(function(m){ return 'x '+esc(m); }).join('<br>'):'Nothing this year.')+'</p><div class="eq"></div>'+(both?'<button class="btn" data-go="compare">[ SEE BOTH LIVES SIDE BY SIDE ]</button>':'<p style="font-size:15px;font-weight:700;line-height:1.6">Now live the same year in the other Georgia.</p><button class="btn" id="playother">[ PLAY '+WORLDS[other()].name+' ]</button>')+'<button class="btn ghost" data-go="world">Back to world select</button><p class="small" style="text-align:center;letter-spacing:1px">THANK YOU FOR WORKING · NO REFUNDS</p></div>';
};
R.compare = function(){
  var a=S.results.today, b=S.results.cap;
  if(!a||!b) return '<div class="paper narrow"><p class="body">Finish both years to unlock this.</p><button class="btn" data-go="world">Back</button></div>';
  var same = a.choices.join()===b.choices.join() && a.char===b.char;
  var netA=a.cash-a.debt, netB=b.cash-b.debt, max=Math.max(Math.abs(netA),Math.abs(netB),1);
  function card(r,name,color){ var net=r.cash-r.debt; return '<div class="paper" style="max-width:none"><p style="font-size:18px;font-weight:700">'+name+'</p><div class="eq"></div><div class="row"><span>Cash</span><span>'+money(r.cash)+'</span></div><div class="row"><span>Debt</span><span>'+money(r.debt)+'</span></div><div class="row"><span>Stress</span><span>'+r.stress+'/10</span></div><div class="row"><span>Future</span><span>'+r.future+'/10</span></div><div class="row"><span>Missed</span><span>'+r.missed.length+'</span></div><div class="track"><div class="fill" style="width:'+Math.max(2,Math.round(100*Math.max(0,net)/max))+'%;background:'+color+'"></div></div></div>'; }
  return '<p class="chip" style="max-width:680px">427÷1 · '+(same?'SAME PERSON, SAME CHOICES':'YOUR TWO YEARS')+'</p><div class="grid2" style="width:100%;max-width:680px">'+card(a,'TODAY','#222')+card(b,'THE PAY CAP','#1d7a4a')+'</div><div class="pulse" style="background:#1d7a4a;max-width:680px">'+(same?'Same choices. ':'')+money(Math.abs(netB-netA))+' '+(netB>=netA?'better off under the cap':'apart')+' after 8 months.</div>'+
   '<div class="paper wide"><p class="kicker" style="color:#222">WHY GEORGIA SHOULD CAP TOP PAY AT 100 : 1</p><div class="point"><span>01</span><span>Georgia grows when the people doing the work can afford to live here.</span></div><div class="point"><span>02</span><span>Higher pay at the bottom means savings instead of credit card debt.</span></div><div class="point"><span>03</span><span>With room to breathe, people take the class, help family, and move up.</span></div><div class="point"><span>04</span><span>And 427 to 1 is just unfair.</span></div><div class="eq"></div><p style="font-size:15px;line-height:1.7;font-weight:700">Georgia should do this because we want to grow as a state. Raising wages builds a stronger financial base for families, eases the burden that keeps people from moving forward socially and educationally, and on top of that, it’s just unfair.</p><button class="btn" data-go="sources">[ SEE ALL SOURCES ]</button><button class="btn ghost" id="replay">Play again</button></div>';
};
R.sources = function(){
  return '<div class="paper wide sources"><p class="kicker">427÷1 · SOURCES</p><h2>Sources</h2><div class="eq"></div><ol style="padding-left:28px;margin:0">'+SOURCES.map(function(s,i){ return '<li id="s'+(i+1)+'"'+(S.srcHl===i+1?' class="hl"':'')+'>'+esc(s[0])+' <a href="'+s[1]+'" target="_blank" rel="noopener">Link</a></li>'; }).join('')+'</ol><div class="eq"></div><p class="kicker" style="color:#222">GAME ASSUMPTIONS</p><p class="body" style="font-size:13px">$22 an hour in the Pay Cap world is this game’s assumption for three years after the law, not a prediction. Take-home pay is estimated with 2026 Social Security, Medicare, federal and Georgia income tax for a single filer working 40 hours a week, 52 weeks a year. The game counts only rent, groceries, power, and gas as monthly bills. The mom, holiday, and lost-hours amounts are story choices, not statistics. Credit card interest is not calculated.</p><p class="body" style="font-size:13px">This is a class project for POLS 1101 at the University of Georgia. It is not affiliated with or endorsed by The Home Depot. Characters are fictional.</p><button class="btn" id="srcback">[ BACK ]</button></div>';
};

function render(){ app.innerHTML = (R[S.screen]||R.title)(); bind(); }
function bind(){
  app.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click', function(){ audio(); if(b.dataset.go==='sources'){ S.back=S.screen; S.srcHl=null; } go(b.dataset.go); }); });
  app.querySelectorAll('[data-src]').forEach(function(b){ b.addEventListener('click', function(){ S.back=S.screen; S.srcHl=+b.dataset.src; S.savedPay = S.screen==='payday'; clearTimers(); S.screen='sources'; render(); var el=document.getElementById('s'+S.srcHl); if(el) el.scrollIntoView({block:'center'}); }); });
  app.querySelectorAll('[data-char]').forEach(function(b){ b.addEventListener('click', function(){ audio(); S.char=b.dataset.char; render(); }); });
  app.querySelectorAll('[data-world]').forEach(function(b){ b.addEventListener('click', function(){ audio(); S.world=b.dataset.world; render(); }); });
  app.querySelectorAll('[data-opt]').forEach(function(b){ b.addEventListener('click', function(){ var ev=events(W())[S.g.m]; var o=ev.opts.filter(function(x){ return x.id===b.dataset.opt; })[0]; choose(o); }); });
  var el;
  if((el=document.getElementById('print'))) el.addEventListener('click', function(){ audio(); sfx.longprint(); timers.push(setTimeout(sfx.kaching,2950)); S.printed='printing'; render(); timers.push(setTimeout(function(){ S.printed='done'; if(S.screen==='title'){ var p=document.querySelector('.printer'); if(p){ p.classList.remove('busy'); } } },3000)); });
  if((el=document.getElementById('reprint'))) el.addEventListener('click', function(){ S.printed=null; render(); timers.push(setTimeout(function(){ var p=document.getElementById('print'); if(p) p.click(); },30)); });
  if((el=document.getElementById('begin'))) el.addEventListener('click', function(){ audio(); newGame(); if(S.world==='cap') go('capintro'); else startPayday(); });
  if((el=document.getElementById('capgo'))) el.addEventListener('click', function(){ startPayday(); });
  if((el=document.getElementById('paynext'))) el.addEventListener('click', function(){ if(S.pay.step<99){ clearTimers(); S.pay.counter=W().take; S.pay.step=99; renderPayday(); } else go('scene'); });
  if((el=document.getElementById('next'))) el.addEventListener('click', nextMonth);
  if((el=document.getElementById('backwork'))) el.addEventListener('click', function(){ startPayday(); });
  if((el=document.getElementById('playother'))) el.addEventListener('click', function(){ S.world=other(); newGame(); if(S.world==='cap') go('capintro'); else startPayday(); });
  if((el=document.getElementById('replay'))) el.addEventListener('click', function(){ S.results={}; store.set('results',{}); go('character'); });
  if((el=document.getElementById('srcback'))) el.addEventListener('click', function(){ var b=S.back||'title'; S.back=null; if(b==='payday'){ S.pay.counter=W().take; S.pay.step=99; } go(b); });
}
render();
})();
</script>
</body>
</html>
